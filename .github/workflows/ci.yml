name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
          - "3.15"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build tooling and install project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .

      - name: Run test suite
        run: |
          python -m unittest tests.test_rally

      - name: Byte-compile package and entry scripts
        run: |
          python -m py_compile rally agent-job rally_core/*.py rally_core/providers/*.py

      - name: CLI and privacy smoke checks
        run: |
          ./rally --help
          ./agent-job --help
          rally --help
          python -m unittest tests.test_rally.RallyRepositoryTests tests.test_rally.AgentJobPrivacyRegressionTests
